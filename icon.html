<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Tracking Loader</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #000;
        color: #fff;
      }

      #main-content {
        padding: 60px;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <!-- Main Content -->
    <div id="main-content">
      <h1>Welcome to the Bus Tracking System</h1>
      <p>Real-time data will be shown after loading...</p>
    </div>



    <script>
      // Hide loader after a few seconds
      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
      }, 3000);
    </script>
  </body>
</html>
